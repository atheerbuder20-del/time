<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت تصاعدي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #timer {
            font-size: 5rem;
            font-weight: bold;
            margin: 20px 0;
            color: #58a6ff;
            font-family: monospace;
        }
        .controls button {
            font-size: 1.2rem;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 6px;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        #btn-start { background-color: #238636; }
        #btn-start:hover { background-color: #2ea043; }
        
        #btn-pause { background-color: #d29922; }
        #btn-pause:hover { background-color: #bb8009; }
        
        #btn-reset { background-color: #da3633; }
        #btn-reset:hover { background-color: #f85149; }
    </style>
</head>
<body>

    <h1>المؤقت التصاعدي</h1>
    <div id="timer">00:00</div>

    <div class="controls">
        <button id="btn-start" onclick="startTimer()">بدء</button>
        <button id="btn-pause" onclick="pauseTimer()">إيقاف مؤقت</button>
        <button id="btn-reset" onclick="resetTimer()">إعادة ضبط</button>
    </div>

    <script>
        let timerInterval;
        let seconds = 0;
        let isRunning = false;

        function updateDisplay() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                timerInterval = setInterval(() => {
                    seconds++;
                    updateDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            seconds = 0;
            updateDisplay();
        }
    </script>
</body>
</html>
