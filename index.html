<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Transparent Count Up Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* خلفية شفافة بالكامل لبرامج البث */
        html, body {
            background-color: transparent !important;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 20px;
            overflow: hidden;
        }

        /* تنسيق الأرقام البارزة والتأثير الثلاثي الأبعاد */
        #timer {
            font-family: 'VT323', monospace;
            font-size: 8rem;
            line-height: 1;
            color: #e0e0e0;
            letter-spacing: 2px;
            /* ظلال لإعطاء شكل البروز (3D) والنص المجوف */
            text-shadow: 
                2px 2px 0px #fff,
                -1px -1px 0px #aaa,
                4px 4px 10px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="timer">00:00:00</div>

    <script>
        let seconds = 0;

        function updateTimer() {
            seconds++;
            
            let hrs = Math.floor(seconds / 3600);
            let mins = Math.floor((seconds % 3600) / 60);
            let secs = seconds % 60;

            let formattedTime = 
                String(hrs).padStart(2, '0') + ':' +
                String(mins).padStart(2, '0') + ':' +
                String(secs).padStart(2, '0');

            document.getElementById('timer').textContent = formattedTime;
        }

        // يبدأ العد التصاعدي تلقائياً بمجرد فتح الصفحة في OBS
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
